[project]
name = "case-workspace"
version = "0.1.0"
description = "Рабочее пространство для ведения дел и формирования документов"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "argon2-cffi>=23.1",
    "platformdirs>=4.0",
    "loguru>=0.7",
    "requests>=2.31",
    "phonenumbers>=8.13",
    "python-docx>=1.1",
    "docxtpl>=0.19",
    "docx2pdf>=0.1.8",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "pytesseract>=0.3.13",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "aiogram>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
case-workspace = "case_workspace.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_workspace"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]